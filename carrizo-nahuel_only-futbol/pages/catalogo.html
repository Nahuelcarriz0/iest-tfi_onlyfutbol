<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo - Only Futbol</title>
  <meta name="description" content="Catálogo de camisetas de clubes y selecciones de Only Futbol">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;700&display=swap">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
  <header class="encabezado">
    <div class="encabezado-contenido">
      <a class="encabezado-marca" href="../index.html"><img class="encabezado-logo" src="../marca/LOGO.png" alt="Only Futbol - Inicio" width="1254" height="1254"></a>

      <button class="navegacion-boton" type="button" aria-expanded="false" aria-controls="navegacion-lista" aria-label="Abrir menú">
        <span class="navegacion-boton-linea"></span>
        <span class="navegacion-boton-linea"></span>
        <span class="navegacion-boton-linea"></span>
      </button>

      <nav class="navegacion" aria-label="Principal">
        <ul class="navegacion-lista" id="navegacion-lista">
          <li><a class="navegacion-enlace" href="../index.html">Inicio</a></li>
          <li><a class="navegacion-enlace" href="nosotros.html">Nosotros</a></li>
          <li><a class="navegacion-enlace" href="catalogo.html">Catálogo</a></li>
          <li><a class="navegacion-enlace" href="consulta.html">Consulta</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="seccion">
      <h1 class="seccion-titulo">Catálogo</h1>

      <div class="catalogo-controles" role="search">
        <div class="catalogo-campo catalogo-campo-busqueda">
          <label class="catalogo-etiqueta" for="buscador-productos">Buscar por nombre</label>
          <input class="catalogo-control" type="search" id="buscador-productos" name="buscador-productos" maxlength="50" autocomplete="off" placeholder="Ej.: River, Argentina, retro">
        </div>

        <div class="catalogo-campo catalogo-campo-filtro">
          <label class="catalogo-etiqueta" for="filtro-categoria">Categoría</label>
          <select class="catalogo-control" id="filtro-categoria" name="filtro-categoria">
            <option value="todas" selected>Todas</option>
          </select>
        </div>
      </div>

      <p class="catalogo-contador" id="catalogo-contador" role="status">Cargando productos…</p>

      <ul class="catalogo-lista">
      </ul>
      <p class="catalogo-mensaje" id="catalogo-mensaje" hidden></p>
    </section>

    <dialog class="vista-producto" id="vista-producto" aria-labelledby="vista-producto-titulo">
      <button class="vista-producto-cerrar" id="vista-producto-cerrar" type="button" aria-label="Cerrar">&times;</button>

      <div class="vista-producto-contenido">
        <img class="vista-producto-imagen" id="vista-producto-imagen" alt="">

        <div class="vista-producto-datos">
          <h2 class="vista-producto-titulo" id="vista-producto-titulo"></h2>
          <p class="vista-producto-descripcion" id="vista-producto-descripcion"></p>

          <fieldset class="vista-producto-talles">
            <legend class="vista-producto-leyenda">Talle</legend>
            <label class="vista-producto-talle"><input type="radio" name="talle-producto" value="S"><span>S</span></label>
            <label class="vista-producto-talle"><input type="radio" name="talle-producto" value="M"><span>M</span></label>
            <label class="vista-producto-talle"><input type="radio" name="talle-producto" value="L"><span>L</span></label>
            <label class="vista-producto-talle"><input type="radio" name="talle-producto" value="XL"><span>XL</span></label>
            <label class="vista-producto-talle"><input type="radio" name="talle-producto" value="XXL"><span>XXL</span></label>
          </fieldset>

          <p class="vista-producto-aviso" id="vista-producto-aviso" role="alert" hidden>Elegí un talle para consultar.</p>

          <a class="tarjeta-producto-boton" id="vista-producto-consultar" href="https://wa.me/543837510380" target="_blank" rel="noopener noreferrer">Consultar</a>
        </div>
      </div>
    </dialog>
  </main>

  <footer class="pie-pagina">
    <p class="pie-pagina-marca">ONLY<span class="pie-pagina-marca-destacada">FUTBOL</span></p>
    <p class="pie-pagina-derechos">&copy; <span id="pie-pagina-anio">2026</span> ONLYFUTBOL. Todos los derechos reservados.</p>
    <p class="pie-pagina-contacto">Celular: <a class="pie-pagina-enlace" href="tel:+543837510380">+54 3837 510380</a></p>
    <p class="pie-pagina-ia">Este sitio fue creado con IA</p>
  </footer>

  <script src="../script/navegacion.js" defer></script>
  <script src="../script/pie-pagina.js" defer></script>
  <script src="../script/catalogo-animacion.js" defer></script>
  <script src="../script/catalogo-talles.js" defer></script>
  <script src="../script/productos.js" defer></script>
</body>
</html>
